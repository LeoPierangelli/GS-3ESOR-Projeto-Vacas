# Sobe o MySQL da API. Na primeira subida roda os scripts oficiais da pasta ../banco
# (01 cria as tabelas, 02 faz a carga inicial). Não há cópia dos scripts aqui.
# Para recriar o banco do zero: docker compose down -v && docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: ordenha-mysql
    environment:
      MYSQL_DATABASE: ordenha
      MYSQL_USER: ordenha
      MYSQL_PASSWORD: ordenha
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ../banco/01_criar_tabelas.sql:/docker-entrypoint-initdb.d/01_criar_tabelas.sql:ro
      - ../banco/02_carga_inicial.sql:/docker-entrypoint-initdb.d/02_carga_inicial.sql:ro
      - ordenha-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uordenha", "-pordenha"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ordenha-mysql-data:
