spring.application.name=ordenha-api

# Banco (valores padrão batem com o docker-compose.yml; dá para trocar por variável de ambiente)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ordenha?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:ordenha}
spring.datasource.password=${DB_PASSWORD:ordenha}

# O schema vem do script .sql (db/01-schema.sql); o Hibernate não cria nem altera tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Não vazar detalhes internos em erros
server.error.include-stacktrace=never
server.error.include-message=never

# Regras de alerta: valores iniciais do MVP, NÃO são parâmetros veterinários validados.
# limite-mastite: condutividade X% acima da média da vaca (0.15 = 15%)
ordenha.regras.limite-mastite=0.15
# limite-queda: litros X% abaixo da média da vaca (0.20 = 20%)
ordenha.regras.limite-queda=0.20
# janela: quantas ordenhas anteriores entram na média
ordenha.regras.janela=7
# ordenhas-seguidas: quantas ordenhas seguidas abaixo do limite para alertar queda
ordenha.regras.ordenhas-seguidas=3
# historico-minimo: sem esse número de ordenhas anteriores não há média confiável
ordenha.regras.historico-minimo=3

# Login: validade do token em horas
ordenha.token.validade-horas=8

# Mensagens de validação em português, independente do idioma do cliente
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
